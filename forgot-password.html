<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestAi - 找回密码</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>找回密码</h2>
            <p style="margin-bottom: 20px; color: #666; text-align: center;">
                请输入您的邮箱地址，我们将发送重置密码的链接
            </p>
            <form id="forgotForm">
                <div class="input-group">
                    <label for="resetEmail">邮箱地址</label>
                    <input type="email" id="resetEmail" name="resetEmail" required>
                </div>
                <button type="submit" class="login-btn">发送重置链接</button>
                <div class="links">
                    <a href="index.html">返回登录</a>
                    <a href="register.html">注册新账号</a>
                </div>
            </form>
        </div>
    </div>
    <script src="navigation.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showMessage('重置密码链接已发送到您的邮箱', 'success');
            setTimeout(() => {
                navigationManager.navigateTo('index.html');
            }, 2000);
        });
    </script>
</body>
</html>
