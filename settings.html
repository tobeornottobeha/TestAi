<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestAi - 系统设置</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h2>系统设置</h2>
            <form>
                <div class="input-group">
                    <label>
                        <input type="checkbox" checked> 启用页面切换动画
                    </label>
                </div>
                <div class="input-group">
                    <label>
                        <input type="checkbox"> 记住登录状态
                    </label>
                </div>
                <div class="input-group">
                    <label for="theme">界面主题</label>
                    <select id="theme" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px;">
                        <option value="default">默认主题</option>
                        <option value="dark">深色主题</option>
                        <option value="light">浅色主题</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="language">语言设置</label>
                    <select id="language" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px;">
                        <option value="zh-CN">简体中文</option>
                        <option value="en-US">English</option>
                    </select>
                </div>
                <button type="button" class="login-btn" onclick="saveSettings()">保存设置</button>
                <div class="links">
                    <a href="dashboard.html">返回控制面板</a>
                    <a href="profile.html">个人资料</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="navigation.js"></script>
    <script>
        // 检查登录状态
        if (!userManager.checkLoginStatus()) {
            navigationManager.navigateTo('index.html');
        }
        
        function saveSettings() {
            showMessage('设置已保存', 'success');
        }
    </script>
</body>
</html>
